name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Swift (${{ matrix.runner }}, ${{ matrix.configuration }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, configuration: debug, xcode: /Applications/Xcode_26.3.app/Contents/Developer }
          - { runner: macos-26, configuration: debug, xcode: /Applications/Xcode.app/Contents/Developer }
          - { runner: macos-26, configuration: release, xcode: /Applications/Xcode.app/Contents/Developer }
          - { runner: xcode-27, configuration: debug, xcode: /Applications/Xcode.app/Contents/Developer }
    env:
      DEVELOPER_DIR: ${{ matrix.xcode }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version
      - name: Verify localization catalog
        run: |
          python3 scripts/localizations.py --check
          python3 scripts/check-concurrency.py
      - name: Swift 6 complete concurrency check
        if: matrix.configuration == 'debug'
        run: sh scripts/swift.sh build -Xswiftc -strict-concurrency=complete
      # Optional live/model/browser/audio/load tests remain disabled. All other
      # tests use synthetic data and injected transports, without provider secrets.
      - name: Run fixture tests
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: sh scripts/swift.sh test -c "$CONFIGURATION"
      - name: Build and verify app bundle
        if: matrix.configuration == 'release'
        env:
          PUDDLE_BUILD_CONFIGURATION: release
        run: |
          make build
          python3 scripts/verify-bundle.py
          test ! -e build/Puddle.app/Contents/Resources/GoogleClient.json
