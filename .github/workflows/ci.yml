name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select-jobs:
    # Pull requests run only the required "Swift (debug)" check. Pushes to main
    # add the release bundle check, and manual runs cover the macOS 15 / Xcode 27
    # compatibility matrix. Skipping unneeded macOS jobs avoids burning hosted
    # runner minutes on duplicate configurations.
    name: Select CI jobs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - name: Choose matrix entries for this event
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - "$EVENT_NAME" <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import sys

          xcode_26 = "/Applications/Xcode.app/Contents/Developer"
          debug = {
              "name": "Swift (debug)",
              "runner": "macos-26",
              "configuration": "debug",
              "xcode": xcode_26,
          }
          release = {
              "name": "Swift (release)",
              "runner": "macos-26",
              "configuration": "release",
              "xcode": xcode_26,
          }
          macos_15 = {
              "name": "Swift (macos-15, debug)",
              "runner": "macos-15",
              "configuration": "debug",
              "xcode": "/Applications/Xcode_26.3.app/Contents/Developer",
          }
          xcode_27 = {
              "name": "Swift (xcode-27, debug)",
              "runner": "xcode-27",
              "configuration": "debug",
              "xcode": xcode_26,
          }

          if sys.argv[1] == "pull_request":
              include = [debug]
          elif sys.argv[1] == "push":
              include = [debug, release]
          else:
              include = [debug, release, macos_15, xcode_27]

          print("include=" + json.dumps(include, separators=(",", ":")))
          PY

  build-and-test:
    needs: select-jobs
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select-jobs.outputs.include) }}
    env:
      DEVELOPER_DIR: ${{ matrix.xcode }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          xcrun --sdk macosx --show-sdk-version
      - name: Verify localization catalog
        run: |
          python3 scripts/localizations.py --check
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/check-concurrency.py
      - name: Swift 6 complete concurrency check
        if: matrix.configuration == 'debug'
        run: sh scripts/swift.sh build -Xswiftc -strict-concurrency=complete
      # Optional live/model/browser/audio/load tests remain disabled. All other
      # tests use synthetic data and injected transports, without provider secrets.
      - name: Run fixture tests
        env:
          CONFIGURATION: ${{ matrix.configuration }}
        run: sh scripts/swift.sh test -c "$CONFIGURATION"
      - name: Build and verify app bundle
        if: matrix.configuration == 'release'
        env:
          PUDDLE_BUILD_CONFIGURATION: release
        run: |
          make build
          python3 scripts/verify-bundle.py
          test ! -e build/Puddle.app/Contents/Resources/GoogleClient.json
